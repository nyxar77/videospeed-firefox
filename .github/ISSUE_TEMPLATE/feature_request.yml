name: Feature request
description: Suggest an improvement or new capability
title: '[Feature]: '
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Video Speed Controller for Firefox.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the use case or limitation behind the request.
      placeholder: I often need to ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how you would like the extension to behave.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or other approaches you have tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, or links that help explain the request.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for similar requests.
          required: true
        - label: This request is for the Firefox version of Video Speed Controller.
          required: true
